<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#052630">
  <title>Aponta Horas | Redefinir senha</title>
  <link rel="icon" href="modular-app-icon-192-v2116.png">
  <link rel="stylesheet" href="style-v2.19.3.css?build=2193">
</head>
<body>
  <div id="loading" class="loading" hidden>
    <div class="spinner"></div><span>Validando link...</span>
  </div>

  <main class="center-screen recovery-screen">
    <section class="auth-card recovery-card">
      <div class="brand">
        <img src="assets/brand/modular-symbol.png" class="brand-symbol" alt="Modular">
        <div>
          <h1>Aponta Horas</h1>
          <p>Redefinição de senha</p>
        </div>
      </div>

      <div id="recoveryValidation">
        <p>Validando o link de redefinição...</p>
      </div>

      <form id="newPasswordForm" class="auth-form active" hidden>
        <label>
          Nova senha
          <input id="newPassword" type="password" autocomplete="new-password"
            minlength="6" required>
        </label>

        <label>
          Confirmar nova senha
          <input id="confirmNewPassword" type="password"
            autocomplete="new-password" minlength="6" required>
        </label>

        <button id="saveNewPasswordBtn" class="btn primary full" type="submit">
          Salvar nova senha
        </button>
      </form>

      <div id="recoveryMessage" class="auth-message" role="status"
        aria-live="polite" hidden></div>

      <a id="backToLoginBtn" class="btn secondary full recovery-back"
        href="https://apontamentos-engmanufatura.modulardtc.workers.dev/?build=2193">
        Voltar para entrar
      </a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth-recovery-v2.19.3.js?build=2193"></script>
</body>
</html>
