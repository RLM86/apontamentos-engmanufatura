<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#052630">
  <title>Aponta Horas | Redefinir senha</title>
  <link rel="icon" href="modular-app-icon-192-v2116.png">
  <link rel="stylesheet" href="style-v2.19.5.css?build=2197">
  <style>
    .recovery-card .recovery-intro {
      margin: 0 0 18px;
      line-height: 1.5;
    }

    .recovery-card .otp-input {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: .42rem;
      text-align: center;
    }

    .recovery-card .recovery-help {
      display: block;
      margin-top: -4px;
      margin-bottom: 14px;
      color: #667085;
      line-height: 1.4;
    }

    .recovery-card .recovery-success {
      padding: 14px;
      border-radius: 10px;
      background: #edf7e7;
      color: #194d23;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="loading" class="loading" hidden>
    <div class="spinner"></div><span>Validando código...</span>
  </div>

  <main class="center-screen recovery-screen">
    <section class="auth-card recovery-card">
      <div class="brand">
        <img src="assets/brand/modular-symbol.png" class="brand-symbol" alt="Modular">
        <div>
          <h1>Aponta Horas</h1>
          <p>Redefinição de senha</p>
        </div>
      </div>

      <div id="recoveryValidation">
        <h2>Digite o código recebido</h2>
        <p class="recovery-intro">
          Informe o e-mail da conta, o código de 8 dígitos enviado pelo Supabase
          e escolha uma nova senha.
        </p>
      </div>

      <form id="otpRecoveryForm" class="auth-form active">
        <label>
          E-mail
          <input
            id="recoveryEmail"
            type="email"
            autocomplete="email"
            required>
        </label>

        <label>
          Código de 8 dígitos
          <input
            id="recoveryCode"
            class="otp-input"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            minlength="8"
            maxlength="8"
            pattern="[0-9]{8}"
            placeholder="00000000"
            required>
        </label>

        <small class="recovery-help">
          Use somente o código do e-mail mais recente.
        </small>

        <label>
          Nova senha
          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required>
        </label>

        <label>
          Confirmar nova senha
          <input
            id="confirmNewPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required>
        </label>

        <button
          id="saveNewPasswordBtn"
          class="btn primary full"
          type="submit">
          Validar código e alterar senha
        </button>
      </form>

      <div
        id="recoveryMessage"
        class="auth-message"
        role="status"
        aria-live="polite"
        hidden></div>

      <a
        id="backToLoginBtn"
        class="btn secondary full recovery-back"
        href="https://apontamentos-engmanufatura.modulardtc.workers.dev/?build=2197">
        Voltar para entrar
      </a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth-recovery-v2.19.5.js?build=2197"></script>
</body>
</html>
