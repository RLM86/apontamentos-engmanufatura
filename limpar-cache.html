<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#052630">
  <title>Aponta Horas | Atualizar tabela</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
      font-family:Arial,Helvetica,sans-serif;background:#f2f6f4;color:#052630}
    .card{width:min(500px,100%);padding:28px;background:#fff;border:1px solid #d7e3dc;
      border-top:6px solid #71ad3e;border-radius:18px;box-shadow:0 18px 45px rgba(5,38,48,.12)}
    h1{margin:0 0 8px;font-size:25px}
    p{line-height:1.5}
    .status{margin-top:18px;padding:15px;border-radius:10px;background:#edf5e9;color:#244b2b}
    .spinner{width:34px;height:34px;margin:18px auto;border:4px solid #d9e6df;
      border-top-color:#052630;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <h1>Aponta Horas</h1>
    <p>Atualizando somente a distribuição e a leitura das colunas.</p>
    <div class="spinner"></div>
    <div id="status" class="status">Removendo a versão anterior...</div>
  </main>
  <script>
    const BUILD="2209";
    const statusBox=document.getElementById("status");

    async function clearApontaCache(){
      try{
        if("serviceWorker" in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(item=>item.unregister()));
        }

        if("caches" in window){
          const names=await caches.keys();
          await Promise.all(names.map(name=>caches.delete(name)));
        }

        statusBox.textContent="Cache limpo. Abrindo Apontamentos...";

        const destination=new URL("./",window.location.href);
        destination.searchParams.set("build",BUILD);
        destination.searchParams.set("refresh",String(Date.now()));

        setTimeout(()=>window.location.replace(destination.toString()),1200);
      }catch(error){
        console.error(error);
        statusBox.textContent="Feche as outras abas do Aponta P3 e atualize esta página.";
      }
    }

    clearApontaCache();
  </script>
</body>
</html>
